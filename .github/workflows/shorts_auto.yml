name: YouTube Shorts Auto Publisher

on:
  schedule:
    # 한국 시간 기준 매일 09:00 (UTC 00:00), 19:00 (UTC 10:00) -> 블로그 발행 30분 후 실행
    - cron: '0 0 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  publish-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트 및 쇼츠 렌더링 라이브러리 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum ffmpeg
          python -m pip install --upgrade pip
          pip install requests pillow numpy gtts moviepy google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: 유튜브 쇼츠 자동 생성 및 업로드 실행
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python generate_shorts.py
