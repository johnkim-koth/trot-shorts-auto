name: YouTube Shorts Auto Publisher

on:
  schedule:
    # 한국 시간 매일 09:00 (UTC 00:00), 19:00 (UTC 10:00) 자동 실행
    - cron: '0 0 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  publish-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트, FFmpeg 및 쇼츠 렌더링 라이브러리 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts moviepy pillow requests beautifulsoup4 gspread google-auth yt-dlp

      - name: 쇼츠 무인 자동 생성 및 구글 드라이브 업로드 실행
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
        run: python render_shorts.py
