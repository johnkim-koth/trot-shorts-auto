name: YouTube Shorts Auto Publisher

on:
  schedule:
    # [OPTIMIZED] 한국 시간(KST) 기준 5060 트로트 시청 골든타임 하루 3회 자동 실행
    # 1) 한국 시간 07:30 (태국 시간 05:30 / UTC 22:30) - 아침 기상 및 출근·산책 시간대
    - cron: '30 22 * * *'
    # 2) 한국 시간 12:30 (태국 시간 10:30 / UTC 03:30) - 점심 식사 및 휴식 시간대
    - cron: '30 3 * * *'
    # 3) 한국 시간 20:30 (태국 시간 18:30 / UTC 11:30) - 저녁 식사 후 TV·스마트폰 최고 피크 시간대
    - cron: '30 11 * * *'
  workflow_dispatch:

# ================= [LOCKED: 이하 실행 환경 및 파이프라인 제어 100% 유지] =================
jobs:
  publish-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트, FFmpeg 및 쇼츠 렌더링 라이브러리 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts moviepy pillow requests beautifulsoup4 gspread google-auth yt-dlp

      - name: 쇼츠 무인 자동 생성 및 구글 드라이브 업로드 실행
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python render_shorts.py
